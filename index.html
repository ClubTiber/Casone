<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casone · case per gruppi in autogestione</title>
<meta name="description" content="Oltre 700 case per gruppi in autogestione in tutta Italia: dite quanti siete, da dove partite e quando, e trovate le case adatte con foto, recapiti e prezzi.">
<meta name="theme-color" content="#f2f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="data/houses.json" as="fetch" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  // tema scelto dall'utente (prima del rendering, per evitare lampi)
  try { const t = JSON.parse(localStorage.getItem('casone:v1') || '{}')?.prefs?.theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#results">Vai ai risultati</a>
<div id="sprite" hidden></div>

<header class="top" role="banner">
  <a class="brand" href="#/" aria-label="Casone, torna alla ricerca">
    <span class="blaze" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Casone</span>
  </a>
  <form class="search" role="search" id="searchForm">
    <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="search" id="q" placeholder="Cerca un nome, un comune o una parola (falò, Assisi, scout…)" autocomplete="off" aria-label="Cerca per nome, comune o parola">
  </form>
  <nav class="nav" aria-label="Sezioni">
    <a href="#/" data-nav="explore"><svg class="ic"><use href="#i-map"/></svg><span>Cerca</span></a>
    <a href="#/liste" data-nav="lists"><svg class="ic"><use href="#i-bookmark"/></svg><span>Le mie case</span><b class="badge" id="navListCount" hidden></b></a>
  </nav>
  <a class="iconbtn" href="#/dati" data-nav="data" title="Da dove vengono i dati" aria-label="Da dove vengono i dati"><svg class="ic"><use href="#i-info"/></svg></a>
  <button type="button" class="iconbtn" id="themeBtn" aria-label="Cambia tema chiaro/scuro"><svg class="ic"><use href="#i-moon"/></svg></button>
</header>

<main id="main">
  <!-- CERCA -->
  <section class="view explore" id="view-explore" data-mode="split">
    <div class="results" id="results" tabindex="-1">
      <div class="ask" id="ask">
        <p class="sentence" id="sentence" aria-label="La vostra uscita"></p>
        <div class="quick" id="quick" aria-label="Filtri rapidi"></div>
      </div>
      <div class="toolbar" id="toolbar">
        <div class="count" id="count" aria-live="polite"></div>
        <div class="spacer"></div>
        <label class="sortlab"><span class="vh">Ordina per</span>
          <select id="sort">
            <option value="rel">Prima le più complete</option>
            <option value="dist">Più vicine</option>
            <option value="prezzo">Prezzo più basso</option>
            <option value="posti_asc">Posti: dal più piccolo</option>
            <option value="posti_desc">Posti: dal più grande</option>
            <option value="nome">Nome A–Z</option>
          </select>
        </label>
        <div class="seg" role="group" aria-label="Vista">
          <button type="button" data-mode="split" aria-pressed="true" title="Schede con foto"><svg class="ic"><use href="#i-grid"/></svg><span>Schede</span></button>
          <button type="button" data-mode="table" aria-pressed="false" title="Elenco compatto"><svg class="ic"><use href="#i-table"/></svg><span>Elenco</span></button>
          <button type="button" data-mode="map" aria-pressed="false" title="Solo mappa"><svg class="ic"><use href="#i-map"/></svg><span>Mappa</span></button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="cards" id="cards"></div>
      <div class="tablewrap" id="tablewrap" hidden></div>
      <div class="more" id="more"></div>
      <footer class="foot" id="foot"></footer>
    </div>
    <div class="mapcol" id="mapcol">
      <div id="map" role="region" aria-label="Mappa delle case"></div>
      <div class="map-tools">
        <label class="maptoggle"><input type="checkbox" id="areaFilter"> Solo le case nell'area visibile</label>
      </div>
      <details class="legend" id="legendBox"><summary>Legenda</summary><div id="legend"></div></details>
    </div>
    <button type="button" class="fab only-mobile" id="mobileToggle"><svg class="ic"><use href="#i-map"/></svg><span>Mappa</span></button>
  </section>

  <!-- LE MIE CASE -->
  <section class="view page" id="view-lists" hidden></section>
  <!-- DATI -->
  <section class="view page" id="view-data" hidden></section>
</main>

<!-- tutti i filtri -->
<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
  <div class="dr-head">
    <h2 id="drawerTitle">Tutti i filtri</h2>
    <button type="button" class="iconbtn" data-close aria-label="Chiudi i filtri"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="dr-body" id="filtersBody"></div>
  <div class="dr-foot">
    <button type="button" class="btn quiet" id="resetAll">Togli tutti i filtri</button>
    <button type="button" class="btn primary" data-close id="showResults">Mostra le case</button>
  </div>
</dialog>
<!-- risposta a una domanda della frase -->
<div class="qpop" id="qpop" role="dialog" aria-modal="false" hidden></div>
<div class="qscrim" id="qscrim" hidden></div>
<!-- dettaglio casa -->
<dialog class="detail" id="detail" aria-labelledby="dTitle"></dialog>
<!-- galleria a schermo intero -->
<dialog class="lightbox" id="lightbox" aria-label="Foto"></dialog>
<!-- finestre varie (import, nuova lista, richiesta) -->
<dialog class="modal" id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
